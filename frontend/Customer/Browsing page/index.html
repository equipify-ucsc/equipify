<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipify — Browse Equipment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Top Nav Bar -->
<header class="top-nav">
  <div class="top-nav__inner">
    <!-- Brand -->
    <div class="brand">
      <img src="https://lh3.googleusercontent.com/d/1SJMNJWiRtoW3SBn_i18aeXhflRq7Y92g" alt="Equipify Logo" class="brand__logo">
      <span class="brand__name">Equipify</span>
    </div>

    <!-- Search Bar -->
    <div class="nav-search">
      <span class="icon nav-search__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </span>
      <label for="nav-search-input" class="sr-only">Search equipment</label>
      <input id="nav-search-input" type="text" placeholder="Search generators, tractors, tents..." class="nav-search__input">
      <button type="button" class="nav-search__button">Search</button>
    </div>

    <!-- Trailing Actions -->
    <div class="nav-actions">
      <!-- Mobile-only: opens the search overlay -->
      <button type="button" class="icon-btn icon-btn--mobile-only" id="mobile-search-toggle" aria-label="Open search" aria-expanded="false" aria-controls="mobile-search-panel">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </span>
      </button>
      <!-- Mobile-only: opens the filters sidebar -->
      <button type="button" class="icon-btn icon-btn--mobile-only" id="mobile-filter-toggle" aria-label="Open filters" aria-expanded="false" aria-controls="filters-sidebar">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line><circle cx="9" cy="6" r="1.6" fill="currentColor" stroke="none"></circle><circle cx="15" cy="12" r="1.6" fill="currentColor" stroke="none"></circle><circle cx="11" cy="18" r="1.6" fill="currentColor" stroke="none"></circle></svg>
        </span>
      </button>
      <button type="button" class="icon-btn" aria-label="Notifications">
        <span class="icon icon--nav" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        </span>
        <span class="icon-btn__badge" aria-hidden="true"></span>
      </button>
      <a class="icon-btn" href="../Wishlist/index.html" aria-label="Wishlist">
        <span class="icon icon--nav" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"></path></svg>
        </span>
      </a>
      <a class="icon-btn" href="../Profile/index.html" aria-label="Account">
        <span class="icon icon--nav" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
        </span>
      </a>
      <a class="icon-btn" href="#" data-logout aria-label="Log out" title="Log out">
        <span class="icon icon--nav" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </span>
      </a>
    </div>
  </div>

  <!-- Mobile search panel (hidden by default, toggled by mobile-search-toggle) -->
  <div class="mobile-search-panel" id="mobile-search-panel" hidden>
    <span class="icon nav-search__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    </span>
    <label for="mobile-search-input" class="sr-only">Search equipment</label>
    <input id="mobile-search-input" type="text" placeholder="Search generators, tractors, tents..." class="nav-search__input">
    <button type="button" class="nav-search__button">Search</button>
  </div>
</header>

<!-- Main Layout Container -->
<div class="page-container">

  <!-- Backdrop shown behind the sidebar when it's open as a mobile overlay -->
  <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

  <!-- SideNavBar -->
  <aside class="sidebar" id="filters-sidebar">
    <div class="sidebar__heading">
      <button type="button" class="sidebar__close" id="sidebar-close" aria-label="Close filters">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="6" y1="18" x2="18" y2="6"></line></svg></span>
      </button>
      <h2 class="sidebar__title">Filters</h2>
      <p class="sidebar__subtitle">Refine your equipment search</p>
    </div>

    <!-- Step 1: Category (always shown). Filled from the catalogue, only
         categories that have listings, each with its count. -->
    <div class="filter-section">
      <div class="filter-section__header">
        <h3 class="filter-section__title" id="category-filter-title">Category</h3>
      </div>
      <div class="filter-list" id="category-filter" role="radiogroup" aria-labelledby="category-filter-title">
        <p class="filter-note">Loading…</p>
      </div>
    </div>

    <!-- Step 2: Equipment type (only once a category is picked) -->
    <div class="filter-section" id="type-filter-section" hidden>
      <hr class="filter-divider">
      <div class="filter-section__header">
        <h3 class="filter-section__title" id="type-filter-title">Equipment Type</h3>
      </div>
      <div class="filter-list" id="type-filter" role="radiogroup" aria-labelledby="type-filter-title"></div>
    </div>

    <!-- Step 3: that type's spec filters (at most 3, only once a type is picked) -->
    <div class="filter-section" id="spec-filter-section" hidden>
      <hr class="filter-divider">
      <div class="filter-section__header">
        <h3 class="filter-section__title">Specifications</h3>
      </div>
      <div class="spec-filters" id="spec-filters"></div>
    </div>

    <hr class="filter-divider">

    <!-- Always shown: daily price -->
    <div class="filter-section">
      <div class="filter-section__header">
        <h3 class="filter-section__title">Daily Rate (LKR)</h3>
      </div>
      <div class="range-pair">
        <label class="range-pair__field">
          <span class="sr-only">Minimum daily rate</span>
          <input type="number" id="min-price" class="select-field" min="0" step="500" placeholder="Min">
        </label>
        <span class="range-pair__dash" aria-hidden="true">–</span>
        <label class="range-pair__field">
          <span class="sr-only">Maximum daily rate</span>
          <input type="number" id="max-price" class="select-field" min="0" step="500" placeholder="Max">
        </label>
      </div>
    </div>

    <hr class="filter-divider">

    <!-- Always shown: availability -->
    <div class="filter-section">
      <div class="filter-section__header">
        <h3 class="filter-section__title">Availability</h3>
      </div>
      <div class="filter-list">
        <label class="filter-option">
          <input type="checkbox" id="available-only">
          <span class="filter-option__label">Available now</span>
        </label>
      </div>
    </div>

    <hr class="filter-divider">

    <!-- Always shown: district -->
    <div class="filter-section">
      <div class="filter-section__header">
        <h3 class="filter-section__title">Location</h3>
      </div>
      <div class="select-field-wrap">
        <label for="location-select" class="sr-only">District</label>
        <select id="location-select" class="select-field">
          <option value="">Any district</option>
          <option>Ampara</option>
          <option>Anuradhapura</option>
          <option>Badulla</option>
          <option>Batticaloa</option>
          <option>Colombo</option>
          <option>Galle</option>
          <option>Gampaha</option>
          <option>Hambantota</option>
          <option>Jaffna</option>
          <option>Kalutara</option>
          <option>Kandy</option>
          <option>Kegalle</option>
          <option>Kilinochchi</option>
          <option>Kurunegala</option>
          <option>Mannar</option>
          <option>Matale</option>
          <option>Matara</option>
          <option>Moneragala</option>
          <option>Mullaitivu</option>
          <option>Nuwara Eliya</option>
          <option>Polonnaruwa</option>
          <option>Puttalam</option>
          <option>Ratnapura</option>
          <option>Trincomalee</option>
          <option>Vavuniya</option>
        </select>
      </div>
    </div>

    <hr class="filter-divider">

    <!-- Always shown: provider (renting party) rating, filled by script.js -->
    <div class="filter-section">
      <div class="filter-section__header">
        <h3 class="filter-section__title" id="rating-filter-title">Provider Rating</h3>
      </div>
      <div class="filter-list" id="rating-filter" role="radiogroup" aria-labelledby="rating-filter-title"></div>
    </div>

    <button type="button" class="clear-filters" id="clear-filters">Clear all filters</button>
  </aside>

  <!-- Main Content Area -->
  <main class="main-content">
    <!-- Page Header & Actions -->
    <div class="content-header">
      <div>
        <h1 class="content-header__title text-headline-lg" id="results-title">Browse Equipment</h1>
        <p class="content-header__subtitle" id="result-count" aria-live="polite"></p>
      </div>
      <div class="sort-control">
        <label for="sort" class="sort-control__label">Sort by:</label>
        <select id="sort">
          <option value="recent">Newest first</option>
          <option value="price_asc">Daily rate: Low to High</option>
          <option value="price_desc">Daily rate: High to Low</option>
          <option value="rating">Highest rated provider</option>
        </select>
      </div>
    </div>

    <!-- Category tiles: one-click entry into step 1 -->
    <nav class="category-tiles" id="category-tiles" aria-label="Equipment categories"></nav>

    <!-- Breadcrumb of the current filter steps, each step clearable -->
    <nav class="filter-crumbs" id="filter-crumbs" aria-label="Current filters" hidden></nav>

    <!-- Product Grid (filled from the API) -->
    <div class="equipment-grid" id="equipment-grid"></div>

    <div class="pager" id="equipment-pager"></div>
  </main>
</div>

<script src="../../shared/api.js"></script>
<script src="../../shared/session.js"></script>
<script src="../../shared/list.js"></script>
<script src="../../shared/catalogue.js"></script>
<script src="script.js"></script>
</body>
</html>
